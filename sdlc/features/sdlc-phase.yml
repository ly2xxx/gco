name: SDLC Phase Check (reusable)

# Runs on a pull request from phase/<feature>/<n> into feature/<feature>: the
# builder's one phase, checked against the approved plan before it is merged.
# It fails on a file outside phase <n>'s targets, a frozen file changed, an
# approved document changed, a failing Verify block for phases 1..n, or a
# failing (or empty) test suite.
#
# Called from a repository's own workflow:
#   on:
#     pull_request:
#       branches: ["feature/**"]
#   jobs:
#     phase:
#       uses: ly2xxx/.github/.github/workflows/sdlc-phase.yml@main

on:
  workflow_call:
    inputs:
      python-version:
        type: string
        default: "3.12"
      install-command:
        type: string
        default: ""
      test-command:
        type: string
        default: python -m pytest -q
      features-dir:
        type: string
        default: sdlc/features

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  check:
    name: Phase check
    if: startsWith(github.head_ref, 'phase/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read        # runs the built code and the plan's commands; writes nothing
    steps:
      - name: Read the feature and phase from the branch name
        id: which
        env:
          HEAD: ${{ github.head_ref }}
          BASE: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [[ ! "$HEAD" =~ ^phase/([a-z0-9][a-z0-9-]{0,63})/([A-Za-z0-9._-]+)$ ]]; then
            echo "::error::A phase branch is named phase/<feature>/<phase>, not $HEAD."; exit 1
          fi
          feature="${BASH_REMATCH[1]}" phase="${BASH_REMATCH[2]}"
          if [ "$BASE" != "feature/$feature" ]; then
            echo "::error::$HEAD goes into feature/$feature, not $BASE."; exit 1
          fi
          echo "feature=$feature" >> "$GITHUB_OUTPUT"
          echo "phase=$phase" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ly2xxx/.github/actions/python-env@main
        with:
          python-version: ${{ inputs.python-version }}
          install-command: ${{ inputs.install-command }}
      - uses: ly2xxx/.github/actions/sdlc-stage@main
        with:
          command: verify
          feature: ${{ steps.which.outputs.feature }}
          phase: ${{ steps.which.outputs.phase }}
          features-dir: ${{ inputs.features-dir }}
          base: ${{ github.base_ref }}
          test-command: ${{ inputs.test-command }}
          report: ${{ runner.temp }}/phase-report.md
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-report
          path: ${{ runner.temp }}/phase-report.md
          if-no-files-found: ignore
