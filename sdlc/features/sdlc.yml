name: SDLC Pipeline (reusable)

# One feature, from a one-line idea to a pull request, in one run and one line:
#
#   resolve → 1 · intent.md ✋ → 2 · spec.md ✋ → 3 · plan.md ✋ → 4 · ⏸ hand off and wait
#           → 5 · verify → 5 · Ollama review → 6 · ✋ open the pull request
#
# Ollama Cloud writes the documents. Step 4 tags them as sdlc/<feature>/approved,
# writes the hand-off for the builder (Claude Code in real work, a person for
# teaching or demos), then waits, for up to build-wait-minutes, until
# build-log.md on the feature branch logs every phase of the plan. The same run
# then verifies the build (deterministic, and fails if the approved documents
# changed), has Ollama review it (advisory), and opens the pull request. The wait
# is a job polling the branch, not an environment gate, so it works in private
# repositories too.
#
# ✋ jobs wait on the review environment when it has required reviewers (public
# repositories, or paid plans). Without them the run carries on by itself.
#
# If step 4 stops waiting (or build-wait-minutes is 0), the run ends there, and
# running it again with the feature and start `build` does steps 5 and 6. Steps
# a run doesn't need show as skipped, still in the same line.
#
# An idea can also arrive as an issue: the caller triggers on `issues: types:
# [labeled]` and passes the issue title as the idea. A line `feature: <name>` in
# the issue body revises that feature; `start: build` with it runs steps 5-6.
#
# Called from a repository's own workflow; ly2xxx/interview-playground has one:
#   jobs:
#     sdlc:
#       uses: ly2xxx/.github/.github/workflows/sdlc.yml@main
#       with: { idea: ..., feature: ..., start: ..., builder: ... }
#       secrets:
#         OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}

on:
  workflow_call:
    inputs:
      idea:
        description: One line. Starts a new feature, or revises the named feature's intent.
        type: string
        default: ""
      feature:
        description: Existing feature folder. Empty for a new idea.
        type: string
        default: ""
      start:
        description: auto, intent, spec, plan or build. auto = intent with an idea, else the first missing document, else build.
        type: string
        default: auto
      builder:
        description: Who builds at step 4 - claude or human. A label only; every builder gets the same hand-off.
        type: string
        default: claude
      model:
        description: Ollama Cloud model for the documents and the review.
        type: string
        default: deepseek-v4-flash:cloud
      think:
        description: Thinking for reasoning models - true, false, low, medium or high. Empty leaves the default.
        type: string
        default: ""
      python-version:
        type: string
        default: "3.12"
      install-command:
        description: Replaces the default install (pyproject.toml, else requirements.txt).
        type: string
        default: ""
      test-command:
        description: The whole test suite. It must collect tests; the plan stage is told it too.
        type: string
        default: python -m pytest -q
      review-environment:
        description: Environment the ✋ jobs wait on.
        type: string
        default: sdlc-review
      features-dir:
        type: string
        default: sdlc/features
      base:
        description: The branch features start from and go into. Empty = the repository's default branch.
        type: string
        default: ""
      build-wait-minutes:
        description: How long step 4 waits for the build (at most 350). 0 ends the run at the hand-off.
        type: number
        default: 180
    secrets:
      OLLAMA_API_KEY:
        required: false
      SDLC_PR_TOKEN:
        description: Optional token that opens the pull request, so CI runs on it.
        required: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  resolve:
    name: Resolve the feature
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.r.outputs.mode }}
      feature: ${{ steps.r.outputs.feature }}
      branch: ${{ steps.r.outputs.branch }}
      base: ${{ steps.r.outputs.base }}
      design: ${{ steps.r.outputs.design }}
      intent: ${{ steps.r.outputs.intent }}
      spec: ${{ steps.r.outputs.spec }}
      plan: ${{ steps.r.outputs.plan }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.base_ref || '' }}
          fetch-depth: 0
      - id: r
        uses: ly2xxx/.github/actions/sdlc-stage@main
        with:
          command: resolve
          idea: ${{ inputs.idea }}
          feature: ${{ inputs.feature }}
          start: ${{ inputs.start }}
          merged-phase: ${{ github.event_name == 'pull_request' && github.event.pull_request.merged && github.head_ref || '' }}
          issue-body: ${{ github.event_name == 'issues' && github.event.issue.body || '' }}
          base: ${{ inputs.base || github.event.repository.default_branch }}
          features-dir: ${{ inputs.features-dir }}

  # ------------------------------------------------------------------ design run: Ollama
  intent:
    name: "1 · Ollama writes intent.md"
    needs: resolve
    if: needs.resolve.outputs.intent == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write       # pushes the document to the feature branch
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ly2xxx/.github/actions/sdlc-stage@main
        with:
          command: stage
          stage: intent
          idea: ${{ inputs.idea }}
          feature: ${{ needs.resolve.outputs.feature }}
          features-dir: ${{ inputs.features-dir }}
          base: ${{ needs.resolve.outputs.base }}
          model: ${{ inputs.model }}
          think: ${{ inputs.think }}
          ollama-api-key: ${{ secrets.OLLAMA_API_KEY }}

  review-intent:
    name: "✋ Review intent.md"
    needs: [resolve, intent]
    if: needs.intent.result == 'success'
    runs-on: ubuntu-latest
    environment: ${{ inputs.review-environment }}
    steps:
      - run: echo "intent.md passed the review gate. Continuing with spec."

  spec:
    name: "2 · Ollama writes spec.md"
    needs: [resolve, review-intent]
    if: ${{ !cancelled() && !failure() && needs.resolve.outputs.spec == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ly2xxx/.github/actions/sdlc-stage@main
        with:
          command: stage
          stage: spec
          feature: ${{ needs.resolve.outputs.feature }}
          features-dir: ${{ inputs.features-dir }}
          base: ${{ needs.resolve.outputs.base }}
          model: ${{ inputs.model }}
          think: ${{ inputs.think }}
          ollama-api-key: ${{ secrets.OLLAMA_API_KEY }}

  review-spec:
    name: "✋ Review spec.md"
    needs: [resolve, spec]
    if: ${{ !cancelled() && needs.spec.result == 'success' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.review-environment }}
    steps:
      - run: echo "spec.md passed the review gate. Continuing with plan."

  plan:
    name: "3 · Ollama writes plan.md (phases)"
    needs: [resolve, review-spec]
    if: ${{ !cancelled() && !failure() && needs.resolve.outputs.plan == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ly2xxx/.github/actions/sdlc-stage@main
        with:
          command: stage
          stage: plan
          feature: ${{ needs.resolve.outputs.feature }}
          features-dir: ${{ inputs.features-dir }}
          base: ${{ needs.resolve.outputs.base }}
          model: ${{ inputs.model }}
          think: ${{ inputs.think }}
          test-command: ${{ inputs.test-command }}
          ollama-api-key: ${{ secrets.OLLAMA_API_KEY }}

  review-plan:
    name: "✋ Review plan.md"
    needs: [resolve, plan]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.review-environment }}
    steps:
      - run: echo "plan.md passed the review gate. Freezing the design for the builder."

  # ------------------------------------------------------------------ step 4: the builder
  handoff:
    name: "4 · ⏸ Hand off and wait for the build"
    needs: [resolve, review-plan]
    if: ${{ !cancelled() && !failure() && needs.resolve.outputs.mode == 'design' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write       # pushes the sdlc/<feature>/approved tag
    outputs:
      built: ${{ steps.wait.outputs.built }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ly2xxx/.github/actions/sdlc-stage@main
        with:
          command: freeze
          feature: ${{ needs.resolve.outputs.feature }}
          features-dir: ${{ inputs.features-dir }}
          builder: ${{ inputs.builder }}
          test-command: ${{ inputs.test-command }}
          build-wait-minutes: ${{ inputs.build-wait-minutes }}
      - id: wait
        uses: ly2xxx/.github/actions/sdlc-stage@main
        with:
          command: wait
          feature: ${{ needs.resolve.outputs.feature }}
          features-dir: ${{ inputs.features-dir }}
          build-wait-minutes: ${{ inputs.build-wait-minutes }}

  # ------------------------------------------------------------------ build run: checks, Ollama, PR
  verify:
    name: "5 · Verify the build"
    needs: [resolve, handoff]
    # A build run (start: build) skips steps 1-4; a design run gets here once step 4 saw the build.
    if: ${{ !cancelled() && !failure() && (needs.resolve.outputs.mode == 'build' || needs.handoff.outputs.built == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read        # runs the built code and the plan's commands; writes nothing
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ly2xxx/.github/actions/python-env@main
        with:
          python-version: ${{ inputs.python-version }}
          install-command: ${{ inputs.install-command }}
      - uses: ly2xxx/.github/actions/sdlc-stage@main
        with:
          command: verify
          feature: ${{ needs.resolve.outputs.feature }}
          features-dir: ${{ inputs.features-dir }}
          base: ${{ needs.resolve.outputs.base }}
          test-command: ${{ inputs.test-command }}
          report: ${{ runner.temp }}/verify-report.md
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-report
          path: ${{ runner.temp }}/verify-report.md
          if-no-files-found: ignore

  review:
    name: "5 · Ollama reviews the build"
    needs: [resolve, verify]
    if: ${{ !cancelled() && needs.verify.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ly2xxx/.github/actions/sdlc-stage@main
        continue-on-error: true   # advisory: a failed review never blocks the pull request
        with:
          command: review
          feature: ${{ needs.resolve.outputs.feature }}
          features-dir: ${{ inputs.features-dir }}
          base: ${{ needs.resolve.outputs.base }}
          model: ${{ inputs.model }}
          think: ${{ inputs.think }}
          ollama-api-key: ${{ secrets.OLLAMA_API_KEY }}
          report: ${{ runner.temp }}/ollama-review.md
      - uses: actions/upload-artifact@v4
        with:
          name: ollama-review
          path: ${{ runner.temp }}/ollama-review.md
          if-no-files-found: ignore

  pr:
    name: "6 · ✋ Open the pull request"
    needs: [resolve, verify, review]
    if: ${{ !cancelled() && needs.verify.result == 'success' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.review-environment }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.branch }}
      - uses: actions/download-artifact@v4
        with:
          name: verify-report
          path: ${{ runner.temp }}
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ollama-review
          path: ${{ runner.temp }}
      - uses: ly2xxx/.github/actions/sdlc-stage@main
        env:
          VERIFY_PASSED: ${{ needs.verify.result == 'success' }}
        with:
          command: pr
          feature: ${{ needs.resolve.outputs.feature }}
          features-dir: ${{ inputs.features-dir }}
          base: ${{ needs.resolve.outputs.base }}
          report: ${{ runner.temp }}/verify-report.md
          review: ${{ runner.temp }}/ollama-review.md
          github-token: ${{ secrets.SDLC_PR_TOKEN || github.token }}
